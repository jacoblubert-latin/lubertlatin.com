# Netlify settings. No build step: Netlify serves the /site folder as-is.
[build]
  publish = "site"
  command = ""

# Send the netlify.app address to the real domain.
[[redirects]]
  from = "https://glittery-bunny-c51d58.netlify.app/*"
  to = "https://lubertlatin.com/:splat"
  status = 301
  force = true

# Links for assignments (/practice/decline/?lesson=5&mode=single) need no
# rule here: the pages are plain files, and Netlify passes a query string
# through its redirects (the two below, and the added trailing slash).

# The drill's data moved under /practice/data/<curriculum>/.
[[redirects]]
  from = "/practice/items.json"
  to = "/practice/data/henle/items.json"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache images and the PDF for a week. CSS/JS keep Netlify's default
# (always fresh), so edits show up right away.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
